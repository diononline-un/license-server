<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8" />
<title>Backup-Wiederherstellung</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<style>
	body { font-family: system-ui, sans-serif; max-width: 560px; margin: 48px auto; padding: 0 20px; color: #1c1b18; }
	h1 { font-size: 20px; }
	.warn { background: #fff3cd; border: 1px solid #ffe08a; padding: 12px 16px; border-radius: 4px; font-size: 13px; margin-bottom: 24px; }
	label { display: block; font-size: 12px; text-transform: uppercase; letter-spacing: 0.05em; color: #666; margin: 16px 0 6px; }
	input { width: 100%; box-sizing: border-box; padding: 10px 12px; border: 1px solid #ccc; border-radius: 4px; font-size: 14px; }
	button { margin-top: 20px; padding: 10px 20px; border: none; border-radius: 4px; background: #1c1b18; color: white; font-size: 14px; cursor: pointer; }
	button:disabled { opacity: 0.5; cursor: default; }
	#result { margin-top: 20px; font-size: 13px; }
	#result.error { color: #b91c1c; }
	#result.success { color: #15803d; }
</style>
</head>
<body>
	<h1>Backup entschlüsseln &amp; wiederherstellen</h1>
	<div class="warn">
		Läuft komplett in diesem Browser — die verschlüsselte Datei und dein Passwort
		verlassen dieses Gerät nie. Ohne das richtige Passwort ist die Datei nicht
		entschlüsselbar, auch nicht vom Betreiber.
	</div>

	<label for="file">Verschlüsselte Backup-Datei (.enc)</label>
	<input type="file" id="file" accept=".enc" />

	<label for="password">Backup-Passwort</label>
	<input type="password" id="password" />

	<button id="run">Entschlüsseln</button>

	<div id="result"></div>

	<script>
		const SALT_BYTES = 16;
		const IV_BYTES = 12;
		const TAG_BYTES = 16;
		const PBKDF2_ITERATIONS = 210000;

		async function decryptBackup(framed, password) {
			const salt = framed.slice(0, SALT_BYTES);
			const iv = framed.slice(SALT_BYTES, SALT_BYTES + IV_BYTES);
			// WebCrypto AES-GCM expects ciphertext+tag concatenated, matching Node's authTag placed
			// right after iv+salt in our framing — reassemble as ciphertext-then-tag for decrypt().
			const tag = framed.slice(SALT_BYTES + IV_BYTES, SALT_BYTES + IV_BYTES + TAG_BYTES);
			const ciphertext = framed.slice(SALT_BYTES + IV_BYTES + TAG_BYTES);
			const ciphertextAndTag = new Uint8Array(ciphertext.byteLength + tag.byteLength);
			ciphertextAndTag.set(new Uint8Array(ciphertext), 0);
			ciphertextAndTag.set(new Uint8Array(tag), ciphertext.byteLength);

			const keyMaterial = await crypto.subtle.importKey(
				'raw', new TextEncoder().encode(password), 'PBKDF2', false, ['deriveKey']
			);
			const key = await crypto.subtle.deriveKey(
				{ name: 'PBKDF2', salt, iterations: PBKDF2_ITERATIONS, hash: 'SHA-256' },
				keyMaterial,
				{ name: 'AES-GCM', length: 256 },
				false,
				['decrypt']
			);
			return crypto.subtle.decrypt({ name: 'AES-GCM', iv }, key, ciphertextAndTag);
		}

		async function gunzip(bytes) {
			const stream = new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));
			return new Uint8Array(await new Response(stream).arrayBuffer());
		}

		document.getElementById('run').addEventListener('click', async () => {
			const result = document.getElementById('result');
			result.className = '';
			result.textContent = '';

			const fileInput = document.getElementById('file');
			const password = document.getElementById('password').value;
			if (!fileInput.files[0] || !password) {
				result.className = 'error';
				result.textContent = 'Datei und Passwort angeben.';
				return;
			}

			try {
				const framed = await fileInput.files[0].arrayBuffer();
				const gzipped = await decryptBackup(framed, password);
				const dbBytes = await gunzip(gzipped);

				const blob = new Blob([dbBytes], { type: 'application/octet-stream' });
				const url = URL.createObjectURL(blob);
				const a = document.createElement('a');
				a.href = url;
				a.download = 'shop-restored.db';
				a.click();
				URL.revokeObjectURL(url);

				result.className = 'success';
				result.textContent = 'Entschlüsselt — Download gestartet (shop-restored.db).';
			} catch (e) {
				result.className = 'error';
				result.textContent = 'Entschlüsselung fehlgeschlagen — falsches Passwort oder beschädigte Datei.';
			}
		});
	</script>
</body>
</html>
